# GitHub Actions — BOG Accounting (GH #10)

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile || pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck and build
        run: pnpm run build:ci
        env:
          DATABASE_URL: ""
          JWT_SECRET: ci-placeholder-not-for-production

      - name: GH compliance reminder
        run: |
          echo "P0: JWT on all routes, CORS lock, deploy API — see docs/GH_COMPLIANCE.md"
