# Keep the Render free-tier API warm so the family & friends preview link
# (/try/<token>) never lands on a cold start. Pings /api/health on a schedule.
# GH #10 (DevOps reliability).

name: keep-warm

on:
  schedule:
    # Every 10 minutes. Render free tier sleeps after ~15 min idle.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          URL="${KEEP_WARM_URL:-https://bog-accounting-api.onrender.com/api/health}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            code=$(curl -sS -m 90 -o /tmp/health.txt -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.txt
              exit 0
            fi
            sleep 20
          done
          echo "Health check did not return 200 after retries" >&2
          cat /tmp/health.txt 2>/dev/null || true
          exit 1
    env:
      KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
