# Local Postgres for BOG — no Supabase URL encoding headaches.
# Usage: docker compose up -d && pnpm run db:bootstrap
services:
  db:
    image: postgres:16-alpine
    container_name: bog-accounting-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: boglocal
      POSTGRES_DB: accounting
    volumes:
      - bog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bog_pg_data:
